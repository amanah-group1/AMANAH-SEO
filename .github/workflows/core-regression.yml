name: Core regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "controlled/**"]
  workflow_dispatch:

jobs:
  php-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: phpunit:9.6
      - name: PHP syntax checks
        shell: bash
        run: |
          set -e
          find plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/core-store-regression.php
          php -l tests/wordpress-inventory-regression.php
          php -l tests/content-checks-regression.php
          php -l tests/content-issue-dedupe-regression.php
          php -l tests/finding-to-task-regression.php
          php -l tests/dashboard-work-direction-regression.php
          php -l tests/task-form-integrity-regression.php
          php -l tests/module-integration-regression.php
          php -l tests/module-licensing-regression.php
          find tests/engine-runtime -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Core data regression tests
        run: |
          php tests/core-store-regression.php
          php tests/wordpress-inventory-regression.php
          php tests/content-checks-regression.php
          php tests/content-issue-dedupe-regression.php
          php tests/finding-to-task-regression.php
          php tests/dashboard-work-direction-regression.php
          php tests/task-form-integrity-regression.php
          php tests/module-integration-regression.php
          php tests/module-licensing-regression.php

          phpunit -c tests/engine-runtime/phpunit.xml.dist
